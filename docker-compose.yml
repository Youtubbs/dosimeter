services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dosimeter-postgres
    environment:
      POSTGRES_DB: dosimeter
      POSTGRES_USER: dosimeter
      POSTGRES_PASSWORD: dosimeter_local_dev
    ports:
      - "55432:5432"
    volumes:
      - dosimeter-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dosimeter -d dosimeter"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs once on every `docker compose up`: migrations, the graph checkpointer
  # tables, then the seed officers, grants and exposures
  migrate:
    build:
      context: .
    container_name: dosimeter-migrate
    command: ["sh", "-c", "python -m dosimeter.repository.migrate up && python -m dosimeter.repository.seeds"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOSIMETER_DB_HOST: postgres
      DOSIMETER_DB_PORT: "5432"
      DOSIMETER_DB_NAME: dosimeter
      DOSIMETER_DB_USER: dosimeter
      DOSIMETER_DB_USE_IAM_AUTH: "false"
      DOSIMETER_DB_PASSWORD: dosimeter_local_dev
      DOSIMETER_DB_SSLMODE: prefer
    restart: "no"

  # The same image that runs on ECS, as the local stand-in for the tool API.
  api:
    build:
      context: .
    container_name: dosimeter-api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DOSIMETER_DB_HOST: postgres
      DOSIMETER_DB_PORT: "5432"
      DOSIMETER_DB_NAME: dosimeter
      DOSIMETER_DB_USER: dosimeter
      DOSIMETER_DB_USE_IAM_AUTH: "false"
      DOSIMETER_DB_PASSWORD: dosimeter_local_dev
      DOSIMETER_DB_SSLMODE: prefer
      # local stand-in only: the officer arrives in a header instead of a verified token
      DOSIMETER_TOOL_API_DEV_IDENTITY: "true"
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-local-placeholder}
      BEDROCK_EMBED_MODEL_ID: ${BEDROCK_EMBED_MODEL_ID:-local-placeholder}
      BEDROCK_KB_ID: ${BEDROCK_KB_ID:-in-memory}
      DOSIMETER_GUARDRAIL_ID: ${DOSIMETER_GUARDRAIL_ID:-not-created-yet}
      AWS_CORPUS_BUCKET_NAME: ${AWS_CORPUS_BUCKET_NAME:-dosimeter-corpus}
      AWS_PACKET_BUCKET_NAME: ${AWS_PACKET_BUCKET_NAME:-dosimeter-packets}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # The read tools as an MCP server, the same image their AgentCore Runtime runs. It
  # needs the DOSIMETER_IDENTITY_* settings in .env to verify callers.
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: dosimeter-mcp
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DOSIMETER_DB_HOST: postgres
      DOSIMETER_DB_PORT: "5432"
      DOSIMETER_DB_NAME: dosimeter
      DOSIMETER_DB_USER: dosimeter
      DOSIMETER_DB_USE_IAM_AUTH: "false"
      DOSIMETER_DB_PASSWORD: dosimeter_local_dev
      DOSIMETER_DB_SSLMODE: prefer
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/mcp/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # The same image AgentCore Runtime runs, as its local stand-in. Point the CLI at it
  # with DOSIMETER_WORKFLOW=runtime and DOSIMETER_RUNTIME_URL=http://localhost:8081
  workflow:
    build:
      context: .
      dockerfile: Dockerfile.workflow
    container_name: dosimeter-workflow
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DOSIMETER_DB_HOST: postgres
      DOSIMETER_DB_PORT: "5432"
      DOSIMETER_DB_NAME: dosimeter
      DOSIMETER_DB_USER: dosimeter
      DOSIMETER_DB_USE_IAM_AUTH: "false"
      DOSIMETER_DB_PASSWORD: dosimeter_local_dev
      DOSIMETER_DB_SSLMODE: prefer
      DOSIMETER_TOOL_API_BASE_URL: http://api:8080
      # the stand-in runs the turn itself rather than forwarding it again
      DOSIMETER_WORKFLOW: local
    volumes:
      - ~/.aws:/home/dosimeter/.aws:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/ping')\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  dosimeter-pgdata:
