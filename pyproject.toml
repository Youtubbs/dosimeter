[project]
name = "dosimeter"
version = "0.1.0"
description = "Multi-agent radiation exposure analysis using LangGraph, Amazon Bedrock, Textract, deterministic regulatory rules, and cited evidence."
requires-python = ">=3.11"
authors = [
    { name = "Abdulmuqsit Jimoh" },
    { name = "Victoria Mulugeta" },
    { name = "Anthony Sherrell" },
]

dependencies = [
    # pre week 6 dependencies
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "flask==3.1.2",
    "sqlalchemy==2.0.43",
    "flask-sqlalchemy==3.1.1",
    "flask-migrate==4.1.0",
    "psycopg[binary]==3.2.10",
    "python-dotenv==1.1.1",
    "boto3==1.40.96",
    "botocore==1.43.96",
    "gunicorn==26.2.0",

    # post week 6 dependencies
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "langchain-aws==1.7.8",
    "langchain-core==1.6.0",

    "pgvector==0.5.0",
    "alembic==1.20.0",

    # dependency for chunking the local runbooks for RAG - external Knowledge Base wouldn't need.
    "langchain-text-splitters==1.0.0",
    "langsmith>0.12",

    # corpus dependencies
    "reportlab==5.0.1",
    "pypdf==6.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",

    # styling imports
    "ruff==0.16.8",
    "import-linter==2.15",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dosimeter*"]

# cli commands eventually will be implemented
#  - submit, assess, dossier, ask, sources, trace, queue, review
[project.scripts]
dosimeter = "dosimeter.cli.main:main"
