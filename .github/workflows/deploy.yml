name: Deploy

# On main: ruff and pytest, a secret scan, then `agentcore deploy` builds both Runtime
# images (workflow and read tools) in CodeBuild, pushes them to ECR and points each
# Runtime at its new image. Last, the workflow Runtime migrates the private RDS database.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  secret-scan:
    name: Secret scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact --verbose

  deploy:
    name: Deploy to AgentCore
    needs: secret-scan
    runs-on: ubuntu-latest

    # GitHub OIDC: the job assumes the deploy role, so no AWS keys live in repo secrets
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Show deploy configuration
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Repository owner: ${{ github.repository_owner }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          echo "SHA: ${{ github.sha }}"
          echo "AWS deploy role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}"

      - name: Inspect GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const parts = token.split('.');
            if (parts.length !== 3) {
              core.setFailed('OIDC token is not a valid JWT');
              return;
            }

            const payload = JSON.parse(
              Buffer.from(parts[1], 'base64url').toString('utf8')
            );

            console.log('GitHub OIDC claims:');
            console.log('aud:', payload.aud);
            console.log('sub:', payload.sub);
            console.log('repository:', payload.repository);
            console.log('repository_id:', payload.repository_id);
            console.log('repository_owner:', payload.repository_owner);
            console.log('repository_owner_id:', payload.repository_owner_id);
            console.log('ref:', payload.ref);
            console.log('ref_type:', payload.ref_type);
            console.log('sha:', payload.sha);
            console.log('workflow:', payload.workflow);
            console.log('workflow_ref:', payload.workflow_ref);
            console.log('job_workflow_ref:', payload.job_workflow_ref);
            console.log('event_name:', payload.event_name);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the AgentCore CLI
        run: npm install -g @aws/agentcore@0.30.0

      - name: Build, push and deploy
        run: agentcore deploy --yes

      - name: Migrate RDS through the workflow Runtime
        run: |
          session="dosimeter-migrate-$(python3 -c 'import uuid; print(uuid.uuid4())')"

          aws bedrock-agentcore invoke-agent-runtime \
            --agent-runtime-arn "${{ vars.WORKFLOW_RUNTIME_ARN }}" \
            --runtime-session-id "$session" \
            --content-type application/json \
            --accept application/json \
            --payload '{"command": "migrate"}' \
            --cli-binary-format raw-in-base64-out \
            migrate.json

          cat migrate.json

          if grep -q '"error"' migrate.json; then
            exit 1
          fi
