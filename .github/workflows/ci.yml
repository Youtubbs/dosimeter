name: CI

on:
  push:
    # uncomment when branch naming conventions are in practice
    # branches:
    #   - "feature/**"
  pull_request:
  # the deploy workflow runs these same checks first
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dosimeter
          POSTGRES_USER: dosimeter
          POSTGRES_PASSWORD: dosimeter_local_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U dosimeter -d dosimeter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: us-east-1
      # the assess test opens its checkpointer from these settings, not from the test URL
      DOSIMETER_DB_HOST: localhost
      DOSIMETER_DB_PORT: "55432"
      DOSIMETER_DB_NAME: dosimeter
      DOSIMETER_DB_USER: dosimeter
      DOSIMETER_DB_PASSWORD: dosimeter_local_dev
      DOSIMETER_DB_USE_IAM_AUTH: "false"
      DOSIMETER_DB_SSLMODE: prefer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
