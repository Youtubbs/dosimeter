name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # id-token: write   # needed for GitHub OIDC -> AWS role

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # Exit code 5 = "no tests collected"; allowed until the first tests land.
        run: pytest -m "not integration and not eval" || [ $? -eq 5 ]

      # - name: Architecture boundaries (DM-16)
